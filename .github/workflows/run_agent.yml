name: Run Affiliate AI Agent

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4  # ✅ هذا جيد
    
    - uses: actions/setup-python@v5  # ✅ هذا جيد
      with:
        python-version: '3.11'  # غيّر إلى 3.11
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run AI Agent
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: python main.py
